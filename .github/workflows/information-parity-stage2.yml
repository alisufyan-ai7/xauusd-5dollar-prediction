name: information-parity-stage2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Information Parity Stage 2 task"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - macro-preflight
          - full-train
  push:
    branches:
      - research/information-parity-v1-stage2-preflight
    paths:
      - ".github/information-parity-stage2-full-train-trigger"
permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"

      - name: Install Stage 2 dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements/information-parity-stage2.lock.txt

      - name: Compile Stage 2 scripts
        run: |
          python scripts/check_information_parity_stage2_environment.py
          python -m py_compile \
            scripts/synchronize_information_parity_m1.py \
            scripts/build_synthetic_dxy_stage2.py \
            scripts/acquire_macro_schedule_stage2.py \
            scripts/build_information_parity_stage2_year.py \
            scripts/validate_information_parity_stage2.py \
            scripts/build_information_parity_manifest.py

      - name: Acquire fixed smoke market window
        shell: bash
        run: |
          set -euo pipefail

          RAW="$RUNNER_TEMP/ip-stage2-smoke-raw"
          mkdir -p "$RAW/xauusd" "$RAW/fx"

          bash scripts/download_dukascopy_m1_generic.sh             xauusd bid 2016-02-01 2016-02-06             "$RAW/xauusd/xauusd-20160201-20160206-m1-bid.csv"

          bash scripts/download_dukascopy_m1_generic.sh             xauusd ask 2016-02-01 2016-02-06             "$RAW/xauusd/xauusd-20160201-20160206-m1-ask.csv"

          for inst in eurusd usdjpy gbpusd usdcad usdsek usdchf; do
            bash scripts/download_dukascopy_m1_generic.sh               "$inst" bid 2016-02-01 2016-02-06               "$RAW/fx/${inst}-20160201-20160206-m1-bid.csv"
          done

      - name: Synchronize XAUUSD smoke market
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/ip-stage2-smoke-raw"
          OUT="data/derived/information-parity-v1-stage2-smoke"
          mkdir -p "$OUT"

          python scripts/synchronize_information_parity_m1.py             "$RAW/xauusd/xauusd-20160201-20160206-m1-bid.csv"             "$RAW/xauusd/xauusd-20160201-20160206-m1-ask.csv"             "$OUT/xauusd-2016-smoke-synchronized.csv"             | tee "$OUT/xauusd-sync-report.json"

      - name: Build synthetic DXY smoke series
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/ip-stage2-smoke-raw"
          OUT="data/derived/information-parity-v1-stage2-smoke"

          python scripts/build_synthetic_dxy_stage2.py             "$RAW/fx/eurusd-20160201-20160206-m1-bid.csv"             "$RAW/fx/usdjpy-20160201-20160206-m1-bid.csv"             "$RAW/fx/gbpusd-20160201-20160206-m1-bid.csv"             "$RAW/fx/usdcad-20160201-20160206-m1-bid.csv"             "$RAW/fx/usdsek-20160201-20160206-m1-bid.csv"             "$RAW/fx/usdchf-20160201-20160206-m1-bid.csv"             "$OUT/synthetic-dxy-2016-smoke.csv"             "$OUT/synthetic-dxy-2016-smoke-report.json"

      - name: Acquire and normalize 2016 macro schedule
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/derived/information-parity-v1-stage2-smoke"
          RAW_MACRO="$RUNNER_TEMP/ip-stage2-macro-raw"

          python scripts/acquire_macro_schedule_stage2.py             2016 2016             "$OUT/macro-event-schedule-2016.csv"             "$OUT/macro-coverage-2016.json"             "$RAW_MACRO"

      - name: Require complete core 2016 macro coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p="data/derived/information-parity-v1-stage2-smoke/macro-coverage-2016.json"
          o=json.load(open(p))
          y=o["years"]["2016"]
          print(json.dumps(y,indent=2,sort_keys=True))
          if not y["stage2_macro_schedule_available"]:
              raise SystemExit("STAGE2_SMOKE_MACRO_INCOMPLETE")
          PY

      - name: Build partial-2016 information layer
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/derived/information-parity-v1-stage2-smoke"
          LAYER="$OUT/layer-2016"
          REPORTS="data/reports/information-parity-v1-stage2-smoke"
          mkdir -p "$REPORTS"

          python scripts/build_information_parity_stage2_year.py             2016             "$OUT/xauusd-2016-smoke-synchronized.csv"             "$OUT/synthetic-dxy-2016-smoke.csv"             "$OUT/macro-event-schedule-2016.csv"             "$OUT/macro-coverage-2016.json"             "$LAYER"             "$REPORTS/build-2016-smoke.json"

      - name: Validate Stage 2 smoke integrity
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/derived/information-parity-v1-stage2-smoke"
          LAYER="$OUT/layer-2016"
          REPORTS="data/reports/information-parity-v1-stage2-smoke"

          python scripts/validate_information_parity_stage2.py             2016             "$LAYER"             "$OUT/synthetic-dxy-2016-smoke.csv"             "$OUT/macro-event-schedule-2016.csv"             "$OUT/macro-coverage-2016.json"             "$REPORTS/integrity-2016-smoke.json"

      - name: Build compact smoke manifests
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/ip-stage2-smoke-raw"
          OUT="data/derived/information-parity-v1-stage2-smoke"
          REPORTS="data/reports/information-parity-v1-stage2-smoke"
          MANIFESTS="data/manifests/information-parity-v1-stage2-smoke"
          mkdir -p "$MANIFESTS"

          python scripts/build_information_parity_manifest.py             "$MANIFESTS/raw-market-files.json"             "$RAW/xauusd/xauusd-20160201-20160206-m1-bid.csv"             "$RAW/xauusd/xauusd-20160201-20160206-m1-ask.csv"             "$RAW/fx/eurusd-20160201-20160206-m1-bid.csv"             "$RAW/fx/usdjpy-20160201-20160206-m1-bid.csv"             "$RAW/fx/gbpusd-20160201-20160206-m1-bid.csv"             "$RAW/fx/usdcad-20160201-20160206-m1-bid.csv"             "$RAW/fx/usdsek-20160201-20160206-m1-bid.csv"             "$RAW/fx/usdchf-20160201-20160206-m1-bid.csv"

          python scripts/build_information_parity_manifest.py             "$MANIFESTS/normalized-files.json"             "$OUT/xauusd-2016-smoke-synchronized.csv"             "$OUT/synthetic-dxy-2016-smoke.csv"             "$OUT/macro-event-schedule-2016.csv"             "$OUT/layer-2016/"*.csv.gz             "$REPORTS/build-2016-smoke.json"             "$REPORTS/integrity-2016-smoke.json"             "$OUT/macro-coverage-2016.json"             "$OUT/synthetic-dxy-2016-smoke-report.json"

          find "$MANIFESTS" "$REPORTS" -type f -print | sort | xargs sha256sum             > "$REPORTS/compact-evidence-sha256.txt"

      - name: Upload compact Stage 2 smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: information-parity-stage2-smoke
          path: |
            data/manifests/information-parity-v1-stage2-smoke/*.json
            data/reports/information-parity-v1-stage2-smoke/*.json
            data/reports/information-parity-v1-stage2-smoke/compact-evidence-sha256.txt
            data/derived/information-parity-v1-stage2-smoke/macro-coverage-2016.json
            data/derived/information-parity-v1-stage2-smoke/synthetic-dxy-2016-smoke-report.json
          if-no-files-found: warn
          retention-days: 90


  macro-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'macro-preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"

      - name: Setup exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"

      - name: Install frozen Stage 2 Python environment
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            -r requirements/information-parity-stage2.lock.txt

      - name: Verify frozen runtime and macro surface
        run: |
          set -euo pipefail
          python scripts/check_information_parity_stage2_environment.py
          python -m py_compile \
            scripts/acquire_macro_schedule_stage2.py \
            scripts/verify_information_parity_stage2_full_train_inputs.py
          mkdir -p data/reports/information-parity-v1-stage2-macro-preflight
          python scripts/verify_information_parity_stage2_full_train_inputs.py \
            data/reports/information-parity-v1-stage2-macro-preflight/input-verification.json

      - name: Acquire and normalize 2016-2021 macro schedule only
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/derived/information-parity-v1-stage2-macro-preflight"
          REPORTS="data/reports/information-parity-v1-stage2-macro-preflight"
          RAW_MACRO="$RUNNER_TEMP/ip-stage2-macro-preflight-raw"
          mkdir -p "$OUT" "$REPORTS"

          python scripts/acquire_macro_schedule_stage2.py \
            2016 2021 \
            "$OUT/macro-event-schedule-2016-2021.csv" \
            "$REPORTS/macro-coverage-2016-2021.json" \
            "$RAW_MACRO"

          python - <<'PY'
          import json
          p="data/reports/information-parity-v1-stage2-macro-preflight/macro-coverage-2016-2021.json"
          o=json.load(open(p))
          print(json.dumps(o["years"],indent=2,sort_keys=True))
          if o.get("status") != "PASS":
              raise SystemExit("STAGE2_MACRO_PREFLIGHT_INCOMPLETE")
          for year in range(2016, 2022):
              if not o["years"][str(year)]["stage2_macro_schedule_available"]:
                  raise SystemExit(f"STAGE2_MACRO_PREFLIGHT_YEAR_INCOMPLETE:{year}")
          PY

      - name: Upload compact macro-preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: information-parity-stage2-macro-preflight
          path: |
            data/reports/information-parity-v1-stage2-macro-preflight/*.json
            data/derived/information-parity-v1-stage2-macro-preflight/macro-event-schedule-2016-2021.csv
          if-no-files-found: warn
          retention-days: 90

  full-train:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full-train') || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"

      - name: Setup exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"

      - name: Install frozen Stage 2 Python environment
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            -r requirements/information-parity-stage2.lock.txt

      - name: Verify frozen runtime and compile full-TRAIN surface
        run: |
          set -euo pipefail
          python scripts/check_information_parity_stage2_environment.py
          python -m py_compile \
            scripts/synchronize_information_parity_m1.py \
            scripts/build_synthetic_dxy_stage2_full_train.py \
            scripts/acquire_macro_schedule_stage2.py \
            scripts/build_information_parity_stage2_year.py \
            scripts/build_information_parity_stage2_full_train.py \
            scripts/validate_information_parity_stage2.py \
            scripts/validate_information_parity_stage2_full_train.py \
            scripts/build_information_parity_manifest.py \
            scripts/verify_information_parity_stage2_full_train_inputs.py \
            scripts/summarize_information_parity_stage2_full_train.py
          bash -n scripts/acquire_information_parity_stage2.sh
          bash -n scripts/download_dukascopy_m1_generic.sh

      - name: Verify repository-controlled full-TRAIN prerequisites
        run: |
          set -euo pipefail
          mkdir -p data/reports/information-parity-v1-stage2-full
          python scripts/verify_information_parity_stage2_full_train_inputs.py \
            data/reports/information-parity-v1-stage2-full/input-verification.json

      - name: Record runtime versions
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE2_NODE_VERSION=$(node --version)" >> "$GITHUB_ENV"
          echo "STAGE2_NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"

      - name: Acquire and normalize 2016-2021 macro schedule
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/derived/information-parity-v1-stage2-full"
          REPORTS="data/reports/information-parity-v1-stage2-full"
          RAW_MACRO="$RUNNER_TEMP/ip-stage2-full-macro-raw"

          python scripts/acquire_macro_schedule_stage2.py \
            2016 2021 \
            "$OUT/macro-event-schedule-2016-2021.csv" \
            "$REPORTS/macro-coverage-2016-2021.json" \
            "$RAW_MACRO"

          python - <<'PY'
          import json
          p="data/reports/information-parity-v1-stage2-full/macro-coverage-2016-2021.json"
          o=json.load(open(p))
          print(json.dumps(o["years"],indent=2,sort_keys=True))
          if o.get("status") != "PASS":
              raise SystemExit("STAGE2_FULL_MACRO_INCOMPLETE")
          for year in range(2016, 2022):
              if not o["years"][str(year)]["stage2_macro_schedule_available"]:
                  raise SystemExit(f"STAGE2_FULL_MACRO_YEAR_INCOMPLETE:{year}")
          PY

      - name: Acquire one same-snapshot 2016-2021 market history
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/ip-stage2-full"
          bash scripts/acquire_information_parity_stage2.sh 2016 2021 "$BASE"

          mkdir -p \
            data/manifests/information-parity-v1-stage2-full \
            data/reports/information-parity-v1-stage2-full

          cp "$BASE/manifests/information-parity-v1-stage2-raw-market-manifest.json" \
            data/manifests/information-parity-v1-stage2-full/raw-market-manifest.json
          cp "$BASE/manifests/information-parity-v1-stage2-synchronized-xauusd-manifest.json" \
            data/manifests/information-parity-v1-stage2-full/synchronized-xauusd-manifest.json
          cp "$BASE/reports/information-parity-v1-stage2-acquisition/"*.json \
            data/reports/information-parity-v1-stage2-full/

      - name: Build continuous 2016-2021 synthetic DXY
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/ip-stage2-full"
          OUT="data/derived/information-parity-v1-stage2-full"
          REPORTS="data/reports/information-parity-v1-stage2-full"
          mkdir -p "$OUT" "$REPORTS"

          python scripts/build_synthetic_dxy_stage2_full_train.py \
            "$BASE/raw/information-parity-v1/fx/m1/bid" \
            "$OUT/synthetic-dxy-2016-2021.csv" \
            "$REPORTS/synthetic-dxy-2016-2021.json"

      - name: Release raw provider files after identities and DXY are frozen
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/ip-stage2-full"
          rm -rf "$BASE/raw/information-parity-v1"

      - name: Build continuous 2016-2021 Information Parity layer
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/ip-stage2-full"
          OUT="data/derived/information-parity-v1-stage2-full"
          LAYER="$OUT/layer"
          REPORTS="data/reports/information-parity-v1-stage2-full"

          python scripts/build_information_parity_stage2_full_train.py \
            "$BASE/derived/information-parity-v1/xauusd/m1" \
            "$OUT/synthetic-dxy-2016-2021.csv" \
            "$OUT/macro-event-schedule-2016-2021.csv" \
            "$REPORTS/macro-coverage-2016-2021.json" \
            "$LAYER" \
            "$REPORTS/build-2016-2021.json"

      - name: Validate continuous full-TRAIN integrity
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/derived/information-parity-v1-stage2-full"
          LAYER="$OUT/layer"
          REPORTS="data/reports/information-parity-v1-stage2-full"

          python scripts/validate_information_parity_stage2_full_train.py \
            "$LAYER" \
            "$OUT/synthetic-dxy-2016-2021.csv" \
            "$OUT/macro-event-schedule-2016-2021.csv" \
            "$REPORTS/macro-coverage-2016-2021.json" \
            "$REPORTS/integrity-2016-2021.json"

      - name: Build normalized compact identity manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/derived/information-parity-v1-stage2-full"
          LAYER="$OUT/layer"
          REPORTS="data/reports/information-parity-v1-stage2-full"
          MANIFESTS="data/manifests/information-parity-v1-stage2-full"

          python scripts/build_information_parity_manifest.py \
            "$MANIFESTS/normalized-full-train-manifest.json" \
            "$OUT/synthetic-dxy-2016-2021.csv" \
            "$OUT/macro-event-schedule-2016-2021.csv" \
            "$LAYER/"*.csv.gz \
            "$REPORTS/build-2016-2021.json" \
            "$REPORTS/integrity-2016-2021.json" \
            "$REPORTS/macro-coverage-2016-2021.json" \
            "$REPORTS/synthetic-dxy-2016-2021.json"

      - name: Assemble and hard-check full-TRAIN summary
        shell: bash
        run: |
          set -euo pipefail
          REPORTS="data/reports/information-parity-v1-stage2-full"
          MANIFESTS="data/manifests/information-parity-v1-stage2-full"

          python scripts/summarize_information_parity_stage2_full_train.py \
            "$REPORTS/input-verification.json" \
            "$REPORTS/synthetic-dxy-2016-2021.json" \
            "$REPORTS/macro-coverage-2016-2021.json" \
            "$REPORTS/build-2016-2021.json" \
            "$REPORTS/integrity-2016-2021.json" \
            "$MANIFESTS/raw-market-manifest.json" \
            "$MANIFESTS/normalized-full-train-manifest.json" \
            "$REPORTS/full-train-summary.json"

      - name: Hash compact full-TRAIN evidence
        shell: bash
        run: |
          set -euo pipefail
          REPORTS="data/reports/information-parity-v1-stage2-full"
          MANIFESTS="data/manifests/information-parity-v1-stage2-full"

          find "$MANIFESTS" "$REPORTS" -type f -print | sort | xargs sha256sum \
            > "$REPORTS/compact-evidence-sha256.txt"

      - name: Upload compact Stage 2 full-TRAIN evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: information-parity-stage2-full-train
          path: |
            data/manifests/information-parity-v1-stage2-full/*.json
            data/reports/information-parity-v1-stage2-full/*.json
            data/reports/information-parity-v1-stage2-full/compact-evidence-sha256.txt
          if-no-files-found: warn
          retention-days: 90
