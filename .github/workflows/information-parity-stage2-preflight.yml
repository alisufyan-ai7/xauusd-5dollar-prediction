name: information-parity-stage2-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup exact Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"

      - name: Setup exact Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install frozen Stage 2 Python environment
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir             -r requirements/information-parity-stage2.lock.txt

      - name: Run deterministic offline preflight
        run: bash scripts/run_information_parity_stage2_preflight.sh
