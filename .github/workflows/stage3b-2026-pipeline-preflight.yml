name: stage3b-2026-pipeline-preflight
on:
  workflow_dispatch:
  push:
    branches:
      - research/information-parity-v1-stage3-preregistration
    paths:
      - ".github/stage3b-2026-pipeline-preflight-trigger"
permissions:
  contents: read
jobs:
  synthetic-end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"
      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install exact Stage 3B lock
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements/information-parity-stage3b-2026.lock.txt
      - name: Static and unit checks
        run: |
          set -euo pipefail
          python scripts/check_information_parity_stage3b_2026_environment.py
          python -m py_compile scripts/validate_stage3b_2026_provider_files.py scripts/build_information_parity_stage3b_2026.py scripts/build_stage3b_2026_dataset.py scripts/run_stage3b_2026_benchmark.py scripts/generate_stage3b_2026_synthetic_market.py
          bash -n scripts/acquire_information_parity_stage3b_2026.sh
          python -m unittest -v tests.test_stage3b_2026_preflight tests.test_stage3b_2026_addendum tests.test_stage3b_2026_execution_preflight tests.test_stage3b_2026_pipeline
      - name: Generate synthetic market around real frozen source events
        run: |
          WORK="$RUNNER_TEMP/stage3b-synthetic"
          python scripts/generate_stage3b_2026_synthetic_market.py research/reference/information-parity-v1/stage3b-source-events-v1.csv "$WORK/raw"
      - name: Validate synthetic provider shape and bounds
        run: |
          WORK="$RUNNER_TEMP/stage3b-synthetic"; mkdir -p "$WORK/manifests" "$WORK/reports" "$WORK/derived"
          python scripts/validate_stage3b_2026_provider_files.py "$WORK/manifests/raw-provider-manifest.json"             "XAUUSD_BID=$WORK/raw/xauusd/xauusd-bid.csv" "XAUUSD_ASK=$WORK/raw/xauusd/xauusd-ask.csv"             "EURUSD_BID=$WORK/raw/fx/eurusd-bid.csv" "USDJPY_BID=$WORK/raw/fx/usdjpy-bid.csv" "GBPUSD_BID=$WORK/raw/fx/gbpusd-bid.csv"             "USDCAD_BID=$WORK/raw/fx/usdcad-bid.csv" "USDSEK_BID=$WORK/raw/fx/usdsek-bid.csv" "USDCHF_BID=$WORK/raw/fx/usdchf-bid.csv"
      - name: Build synthetic bounded information state
        run: |
          WORK="$RUNNER_TEMP/stage3b-synthetic"
          python scripts/synchronize_information_parity_m1.py "$WORK/raw/xauusd/xauusd-bid.csv" "$WORK/raw/xauusd/xauusd-ask.csv" "$WORK/derived/xauusd-synchronized.csv" > "$WORK/reports/xauusd-sync.json"
          python scripts/build_synthetic_dxy_stage2.py "$WORK/raw/fx/eurusd-bid.csv" "$WORK/raw/fx/usdjpy-bid.csv" "$WORK/raw/fx/gbpusd-bid.csv" "$WORK/raw/fx/usdcad-bid.csv" "$WORK/raw/fx/usdsek-bid.csv" "$WORK/raw/fx/usdchf-bid.csv" "$WORK/derived/synthetic-dxy.csv" "$WORK/reports/synthetic-dxy.json"
          python scripts/build_information_parity_stage3b_2026.py "$WORK/derived/xauusd-synchronized.csv" "$WORK/derived/synthetic-dxy.csv" "$WORK/derived/layer" "$WORK/reports/layer-build.json"
      - name: Join real frozen teacher to fake market and run frozen models
        run: |
          WORK="$RUNNER_TEMP/stage3b-synthetic"
          python scripts/build_stage3b_2026_dataset.py "$WORK/derived/layer" "$WORK/derived/synthetic-dxy.csv" research/reference/information-parity-v1/stage3b-source-events-v1.csv research/reference/information-parity-v1/stage3b-2026-feature-allowlists-v1.json "$WORK/derived/candidates.csv.gz" "$WORK/reports/dataset.json"
          python scripts/run_stage3b_2026_benchmark.py "$WORK/derived/candidates.csv.gz" research/reference/information-parity-v1/stage3b-2026-feature-allowlists-v1.json "$WORK/reports/benchmark.json" "$WORK/reports/predictions.csv"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"stage3b-synthetic/reports/benchmark.json"
          o=json.loads(p.read_text())
          assert o["status"]=="PASS" and o["folds"]==39
          print("STAGE3B_SYNTHETIC_END_TO_END_PASS",o["scientific_result"])
          PY
