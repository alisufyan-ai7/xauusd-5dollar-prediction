name: stage3b-2026-transport-recovery
on:
  push:
    branches:
      - research/information-parity-v1-stage3-preregistration
    paths:
      - ".github/stage3b-2026-transport-recovery-trigger"
permissions:
  contents: read
jobs:
  recovery-provider-and-benchmark:
    if: ${{ contains(github.event.head_commit.message, '[STAGE3B_PROVIDER_RECOVERY_D134]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      STAGE3B_WORK: stage3b-recovery-work
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: One-attempt immutable recovery trigger guard
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -f .github/stage3b-2026-transport-recovery-trigger
          printf '%s\n' \
            'D-136 authorized D-134 transport recovery execution' \
            'authorization=8cdd4edf222b88ac1d7ce15e3d3ac8639a2be155' \
            'transport=dukascopy-node@1.51.1' \
            'scope=2026-06-01T00:00:00Z/2026-10-09T00:00:00Z' \
            'preflight_run=45901246019' \
            'attempt=1' > expected-recovery-trigger.txt
          cmp --silent expected-recovery-trigger.txt .github/stage3b-2026-transport-recovery-trigger

      - name: Setup exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"

      - name: Install exact Stage 3B Python lock
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements/information-parity-stage3b-2026.lock.txt

      - name: Install exact recovery transport browser
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.3"
          test "$(npm --version)" = "10.9.9"
          npx -y dukascopy-node@1.51.1 --help > "$RUNNER_TEMP/dukascopy-1.51.1-help.txt"
          grep -q -- "--waf-mode" "$RUNNER_TEMP/dukascopy-1.51.1-help.txt"
          grep -q -- "--waf-token-cache-path" "$RUNNER_TEMP/dukascopy-1.51.1-help.txt"
          npx -y dukascopy-node@1.51.1 --install-browser

      - name: Final no-provider recovery guards
        run: |
          set -euo pipefail
          python scripts/check_information_parity_stage3b_2026_environment.py
          python scripts/stage3b_2026_transport_recovery_preflight.py
          python -m unittest -v             tests.test_stage3b_2026_preflight             tests.test_stage3b_2026_addendum             tests.test_stage3b_2026_execution_preflight             tests.test_stage3b_2026_pipeline             tests.test_stage3b_2026_transport_recovery
          bash -n scripts/download_dukascopy_m1_recovery.sh
          bash -n scripts/acquire_information_parity_stage3b_2026_recovery.sh

      - name: Single D-134 recovery acquisition and causal layer build
        run: bash scripts/acquire_information_parity_stage3b_2026_recovery.sh "$STAGE3B_WORK"

      - name: Build frozen Stage 3B candidate dataset
        run: |
          python scripts/build_stage3b_2026_dataset.py "$STAGE3B_WORK/derived/layer" "$STAGE3B_WORK/derived/synthetic-dxy.csv" research/reference/information-parity-v1/stage3b-source-events-v1.csv research/reference/information-parity-v1/stage3b-2026-feature-allowlists-v1.json "$STAGE3B_WORK/derived/candidates.csv.gz" "$STAGE3B_WORK/reports/dataset.json"

      - name: Run frozen GOLD versus FULL Stage 3B benchmark
        run: |
          python scripts/run_stage3b_2026_benchmark.py "$STAGE3B_WORK/derived/candidates.csv.gz" research/reference/information-parity-v1/stage3b-2026-feature-allowlists-v1.json "$STAGE3B_WORK/reports/benchmark.json" "$STAGE3B_WORK/reports/predictions.csv"

      - name: Hash compact recovery evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$STAGE3B_WORK/reports" "$STAGE3B_WORK/manifests"
          find "$STAGE3B_WORK/reports" "$STAGE3B_WORK/manifests" -type f -print | sort | xargs -r sha256sum > "$STAGE3B_WORK/reports/compact-evidence-sha256.txt"

      - name: Remove recovery provider payloads and WAF state before artifact upload
        if: always()
        run: rm -rf "$STAGE3B_WORK/raw" "$STAGE3B_WORK/private" "$STAGE3B_WORK/derived"

      - name: Upload compact recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage3b-2026-transport-recovery
          path: |
            stage3b-recovery-work/reports/**
            stage3b-recovery-work/manifests/**
          if-no-files-found: warn
          retention-days: 90
