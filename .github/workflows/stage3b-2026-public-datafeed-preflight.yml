name: stage3b-2026-public-datafeed-preflight
on:
  push:
    branches:
      - research/information-parity-v1-stage3-preregistration
    paths:
      - ".github/stage3b-2026-public-datafeed-preflight-trigger"
permissions:
  contents: read
jobs:
  exact-python-no-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Verify exact runtime and compile
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.14"
          python -m py_compile scripts/decode_dukascopy_datafeed_m1.py scripts/stage3b_2026_public_datafeed_preflight.py scripts/acquire_dukascopy_public_datafeed_stage3b_2026.py tests/test_stage3b_2026_public_datafeed.py tests/test_stage3b_2026_public_datafeed_execution.py
          bash -n scripts/acquire_information_parity_stage3b_2026_public_datafeed.sh
      - name: D-144 deterministic no-provider suite
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_stage3b_2026_public_datafeed tests.test_stage3b_2026_public_datafeed_execution
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import stage3b_2026_public_datafeed_preflight as p
          import acquire_dukascopy_public_datafeed_stage3b_2026 as a
          plan=p.static_plan()
          assert plan['provider_enabled'] is False
          assert plan['logical_series']==8
          assert plan['calendar_days']==130
          assert plan['hard_get_cap']==1050
          assert a.PROVIDER_EXECUTION_ENABLED is False
          assert a.D144_AUTHORIZATION_SHA=='eb05ac27af18f68232d86a9148597aa565688709'
          assert 8+p.full_request_count()==1048
          print('D144_EXACT_RUNTIME_NO_PROVIDER_PASS', plan)
          PY
