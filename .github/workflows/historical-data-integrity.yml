name: historical-data-integrity

on:
  push:
    branches:
      - research/exp001-foundation
    paths:
      - ".github/reconstruct-2017-trigger"
  workflow_dispatch:
    inputs:
      mode:
        description: "Integrity task"
        required: true
        default: "full-history"
        type: choice
        options:
          - public-day-smoke
          - month-diagnostic
          - year-2025-pilot
          - locked-2020
          - reconstruct-2017
          - full-history

jobs:
  public-day-smoke:
    if: ${{ inputs.mode == 'public-day-smoke' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download one public XAUUSD M1 day and validate
        run: bash scripts/download_xauusd_m1.sh 2026-09-01 2026-09-02 data/raw/dukascopy/xauusd/m1/smoke.csv
      - name: Label the validated smoke sample
        run: python scripts/label_exp001.py data/raw/dukascopy/xauusd/m1/smoke.csv data/results/exp001-smoke-labels.csv

  month-diagnostic:
    if: ${{ inputs.mode == 'month-diagnostic' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run one-month XAUUSD diagnostic
        run: bash scripts/run_exp001_diagnostic.sh 2026-08-01 2026-09-01 data

  year-2025-pilot:
    if: ${{ inputs.mode == 'year-2025-pilot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire and manifest XAUUSD 2025
        run: bash scripts/acquire_exp001_history.sh 2025 2025 data
      - name: Upload compact manifest
        uses: actions/upload-artifact@v4
        with:
          name: exp001-2025-acquisition-manifest
          path: data/manifests/exp001-history-manifest.json

  locked-2020:
    if: ${{ inputs.mode == 'locked-2020' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce locked 2020 chunk
        run: bash scripts/acquire_locked_year.sh 2020 data 3

  reconstruct-2017:
    if: ${{ github.event_name == 'push' || inputs.mode == 'reconstruct-2017' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct locked 2017 from monthly chunks
        run: bash scripts/reconstruct_locked_year.sh 2017 data
      - name: Compress reconstructed locked 2017
        run: gzip -9 -c data/raw/dukascopy/xauusd/m1/xauusd-2017-01-01-2018-01-01-m1.csv > xauusd-2017-locked.csv.gz
      - name: Upload reconstructed locked 2017
        uses: actions/upload-artifact@v4
        with:
          name: exp001-locked-2017-reconstructed
          path: xauusd-2017-locked.csv.gz
          retention-days: 90

  full-history:
    if: ${{ inputs.mode == 'full-history' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire XAUUSD 2016-2025 yearly chunks
        run: bash scripts/acquire_exp001_history.sh 2016 2025 data
      - name: Verify all acquired chunks against dataset lock
        run: |
          for year in $(seq 2016 2025); do
            next=$((year+1))
            file="data/raw/dukascopy/xauusd/m1/xauusd-${year}-01-01-${next}-01-01-m1.csv"
            if ! python3 scripts/verify_locked_year.py research/EXP-001_DATASET_LOCK.json "$year" "$file"; then
              bash scripts/acquire_locked_year.sh "$year" data 3
            fi
          done
      - name: Label and partition full admitted history
        run: bash scripts/run_full_history_labeling.sh data
      - name: Run non-sealed features and baselines
        run: bash scripts/run_features_baselines.sh data
      - name: Upload acquisition manifest
        uses: actions/upload-artifact@v4
        with:
          name: exp001-2016-2025-acquisition-manifest
          path: data/manifests/exp001-history-manifest.json
      - name: Upload sealed partition summary
        uses: actions/upload-artifact@v4
        with:
          name: exp001-2016-2025-partition-summary
          path: data/reports/exp001/partition-summary.json
      - name: Upload initial non-sealed baseline report
        uses: actions/upload-artifact@v4
        with:
          name: exp001-initial-baselines
          path: data/reports/exp001/initial-baselines.json
