name: foundation-checks

on:
  push:
    branches:
      - research/exp001-foundation
      - research/exp002-executable-target-v1
      - research/exp003-economic-value-v1
      - research/exp004-shift-aware-calibrated-ev-v1
      - research/exp005-downside-first-competing-risk-v1
      - research/exp006-causal-path-state-v1
      - research/exp007-causal-sequence-v1
      - research/exp008-competing-hazard-v1
      - research/root-reset-event-driven-v1
      - research/root-reset-v2-joint-excursion
      - research/root-reset-v3-setup-screening
      - research/root-reset-v4-badar-core
  pull_request:
  workflow_dispatch:

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic validator smoke test
        run: python tests/test_validate_m1_smoke.py
      - name: Run EXP-001 barrier-label unit tests
        run: python tests/test_label_exp001.py
      - name: Run year-context labeler smoke test
        run: python tests/test_label_year_context.py
      - name: Run EXP-002 executable-label tests
        run: python tests/test_label_exp002.py
      - name: Run EXP-002 synchronization tests
        run: python tests/test_synchronize_exp002_m1.py
      - name: Run diagnostic smoke test
        run: python tests/test_diagnose_exp001_smoke.py
      - name: Run manifest builder smoke test
        run: python tests/test_build_manifest_smoke.py
      - name: Run partition boundary tests
        run: python tests/test_partition_exp001.py
      - name: Run final-OOS sealing test
        run: python tests/test_partition_summary_seal.py
      - name: Run feature engine smoke test
        run: python tests/test_features_smoke.py
      - name: Run baseline smoke test
        run: python tests/test_baseline_smoke.py
      - name: Run reconstruction boundary test
        run: python tests/test_reconstruct_locked_year.py
      - name: Compile year-context labeler
        run: python -m py_compile scripts/label_exp001_year_context.py
      - name: Compile logistic V1 script
        run: python -m py_compile scripts/logistic_exp001_v1.py
      - name: Compile GBT V1 script
        run: python -m py_compile scripts/gbt_exp001_v1.py
      - name: Compile calibration V1 script
        run: python -m py_compile scripts/calibration_exp001_v1.py
      - name: Compile abstention robustness V1 script
        run: python -m py_compile scripts/abstention_robustness_exp001_v1.py
      - name: Compile execution economics V1 script
        run: python -m py_compile scripts/execution_economics_exp001_v1.py
      - name: Compile V2 execution candidate exporter
        run: python -m py_compile scripts/export_execution_candidates_exp001_v2.py
      - name: Compile Dukascopy tick validator
        run: python -m py_compile scripts/validate_dukascopy_ticks.py
      - name: Compile execution economics V2 script
        run: python -m py_compile scripts/execution_economics_exp001_v2.py
      - name: Compile EXP-002 synchronizer
        run: python -m py_compile scripts/synchronize_exp002_m1.py
      - name: Compile EXP-002 executable labeler
        run: python -m py_compile scripts/label_exp002.py
      - name: Compile EXP-002 spread feature augmenter
        run: python -m py_compile scripts/augment_features_exp002.py
      - name: Compile EXP-002 GBT V1
        run: python -m py_compile scripts/gbt_exp002_v1.py
      - name: Compile EXP-002 execution economics V1
        run: python -m py_compile scripts/execution_economics_exp002_v1.py
      - name: Compile EXP-002 economic failure diagnosis V1
        run: python -m py_compile scripts/diagnose_exp002_economic_failure_v1.py
      - name: Compile EXP-003 economic value model V1
        run: python -m py_compile scripts/economic_value_exp003_v1.py
      - name: Compile EXP-003 threshold economics V1
        run: python -m py_compile scripts/threshold_economics_exp003_v1.py
      - name: Compile EXP-003 EV miscalibration diagnosis V1
        run: python -m py_compile scripts/diagnose_exp003_ev_miscalibration_v1.py
      - name: Compile EXP-004 shift-aware calibrated EV V1
        run: python -m py_compile scripts/exp004_shift_aware_calibrated_ev_v1.py
      - name: Compile EXP-005 downside-first direct economic model V1
        run: python -m py_compile scripts/exp005_downside_first_direct_v1.py
      - name: Compile EXP-006 causal path feature builder
        run: python -m py_compile scripts/augment_features_exp006_path.py
      - name: Compile EXP-006 causal path-state V1
        run: python -m py_compile scripts/exp006_causal_path_state_v1.py
      - name: Compile EXP-007 causal sequence V1
        run: python -m py_compile scripts/exp007_causal_sequence_v1.py
      - name: Compile EXP-008 competing hazard V1
        run: python -m py_compile scripts/exp008_competing_hazard_v1.py
      - name: Compile root reset event-driven V1
        run: python -m py_compile scripts/root_reset_event_driven_v1.py
      - name: Compile root-reset V1 gate-overlap diagnosis
        run: python -m py_compile scripts/diagnose_root_reset_v1_gates.py
      - name: Compile Root-Reset V2 joint excursion
        run: python -m py_compile scripts/root_reset_v2_joint_excursion.py
      - name: Compile V2 excursion calibration diagnosis
        run: python -m py_compile scripts/diagnose_root_reset_v2_excursion_calibration.py
      - name: Compile Root-Reset V3 setup screening
        run: python -m py_compile scripts/screen_structural_setup_families.py
      - name: Compile Root-Reset V4 Badar-Core
        run: python -m py_compile scripts/root_reset_v4_badar_core.py
      - name: Compile V4 translation diagnosis
        run: python -m py_compile scripts/diagnose_root_reset_v4_translation.py
      - name: Compile Root-Reset V5 Badar source-fidelity
        run: python -m py_compile scripts/root_reset_v5_badar_source_fidelity.py
      - name: Install Information Parity Stage 2 foundation dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy pandas
      - name: Run Information Parity Stage 2 foundation tests
        run: python tests/test_information_parity_stage2_foundation.py
      - name: Compile Information Parity Stage 2 synchronizer
        run: python -m py_compile scripts/synchronize_information_parity_m1.py
      - name: Compile Information Parity Stage 2 DXY builder
        run: python -m py_compile scripts/build_synthetic_dxy_stage2.py
      - name: Compile Information Parity Stage 2 annual builder
        run: python -m py_compile scripts/build_information_parity_stage2_year.py
      - name: Compile Information Parity Stage 2 macro acquisition
        run: python -m py_compile scripts/acquire_macro_schedule_stage2.py
      - name: Compile Information Parity Stage 2 integrity validator
        run: python -m py_compile scripts/validate_information_parity_stage2.py
      - name: Compile Information Parity Stage 2 manifest builder
        run: python -m py_compile scripts/build_information_parity_manifest.py
      - name: Compile Exness MT5 tick probe
        run: python -m py_compile scripts/exness_mt5_tick_probe.py
