name: foundation-checks

on:
  push:
    branches:
      - research/exp001-foundation
  pull_request:
  workflow_dispatch:

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic validator smoke test
        run: python tests/test_validate_m1_smoke.py
      - name: Run EXP-001 barrier-label unit tests
        run: python tests/test_label_exp001.py
      - name: Run diagnostic smoke test
        run: python tests/test_diagnose_exp001_smoke.py
      - name: Run manifest builder smoke test
        run: python tests/test_build_manifest_smoke.py
      - name: Run partition boundary tests
        run: python tests/test_partition_exp001.py
      - name: Run final-OOS sealing test
        run: python tests/test_partition_summary_seal.py

  public-data-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download one public XAUUSD M1 day and validate
        run: bash scripts/download_xauusd_m1.sh 2026-09-01 2026-09-02 data/raw/dukascopy/xauusd/m1/smoke.csv
      - name: Label the validated smoke sample
        run: python scripts/label_exp001.py data/raw/dukascopy/xauusd/m1/smoke.csv data/results/exp001-smoke-labels.csv
      - name: Summarize label distribution
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          p='data/results/exp001-smoke-labels.csv'
          rows=list(csv.DictReader(open(p, encoding='utf-8')))
          out={
            'rows': len(rows),
            'buy': dict(Counter(r['buy_label'] for r in rows)),
            'sell': dict(Counter(r['sell_label'] for r in rows)),
            'coverage_complete': sum(r['coverage_complete']=='True' for r in rows),
            'coverage_incomplete': sum(r['coverage_complete']!='True' for r in rows),
          }
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

  multi-period-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run one-month XAUUSD diagnostic
        run: bash scripts/run_exp001_diagnostic.sh 2026-08-01 2026-09-01 data

  one-year-acquisition-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire and manifest XAUUSD 2025
        run: bash scripts/acquire_exp001_history.sh 2025 2025 data
      - name: Print acquisition manifest
        run: cat data/manifests/exp001-history-manifest.json
      - name: Upload compact manifest
        uses: actions/upload-artifact@v4
        with:
          name: exp001-2025-acquisition-manifest
          path: data/manifests/exp001-history-manifest.json

  full-history-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire XAUUSD 2016-2025 yearly chunks
        run: bash scripts/acquire_exp001_history.sh 2016 2025 data
      - name: Label and partition full admitted history
        run: bash scripts/run_full_history_labeling.sh data
      - name: Print sealed partition summary
        run: cat data/reports/exp001/partition-summary.json
      - name: Print consolidated acquisition manifest
        run: cat data/manifests/exp001-history-manifest.json
      - name: Upload compact acquisition manifest
        uses: actions/upload-artifact@v4
        with:
          name: exp001-2016-2025-acquisition-manifest
          path: data/manifests/exp001-history-manifest.json
      - name: Upload sealed partition summary
        uses: actions/upload-artifact@v4
        with:
          name: exp001-2016-2025-partition-summary
          path: data/reports/exp001/partition-summary.json

  locked-2020-repro-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce locked 2020 chunk
        run: bash scripts/acquire_locked_year.sh 2020 data 3
