name: foundation-checks

on:
  push:
    branches:
      - research/exp001-foundation
  pull_request:
  workflow_dispatch:

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic validator smoke test
        run: python tests/test_validate_m1_smoke.py

  public-data-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download one public XAUUSD M1 day and validate
        run: bash scripts/download_xauusd_m1.sh 2026-09-01 2026-09-02 data/raw/dukascopy/xauusd/m1/smoke.csv
